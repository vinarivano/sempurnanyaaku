<ul>
    <li><a href="index.html">Home</a></li>

<div class="logo">🎓</div>

<h1>Smart Grade Calculator</h1>

<p>Calculate your grades easily 📚</p>

<p>
<a href="https://colab.research.google.com/drive/1PThQitLQ6JWF3hUXRXT9u8iOvypiTXXl?usp=sharing" target="_blank">
<button>

</a>

<div class="card">

    <h2>📝 Input Nilai</h2>

    <input
    type="number"
    id="tugas"
    placeholder="Masukkan Nilai Tugas">

    <br>

    <input
    type="number"
    id="ulangan"
    placeholder="Masukkan Nilai Ulangan Harian">

    <br>

    <input
    type="number"
    id="ujian"
    placeholder="Masukkan Nilai Ujian Akhir">

    <br><br>

    <button onclick="hitungNilai()">
        Hitung Nilai
    </button>

</div>

<div class="card">

    <h2>📊 Hasil</h2>

    <p class="hasil">
        Nilai Akhir:
        <span id="nilai">0</span>
    </p>

    <p class="hasil">
        Grade:
        <span id="grade">-</span>
    </p>

    <p class="hasil">
        Status:
        <span id="status">-</span>
    </p>

</div>

<script>

function hitungNilai(){

    let tugas =
    parseFloat(
    document.getElementById("tugas").value
    );

    let ulangan =
    parseFloat(
    document.getElementById("ulangan").value
    );

    let ujian =
    parseFloat(
    document.getElementById("ujian").value
    );

    if(
        isNaN(tugas) ||
        isNaN(ulangan) ||
        isNaN(ujian)
    ){
        alert("Isi semua nilai terlebih dahulu!");
        return;
    }

    let nilai =
    (0.3 * tugas) +
    (0.3 * ulangan) +
    (0.4 * ujian);

    let grade;

    if(nilai > 90){
        grade = "A";
    }
    else if(nilai > 75){
        grade = "B";
    }
    else if(nilai > 60){
        grade = "C";
    }
    else if(nilai > 50){
        grade = "D";
    }
    else{
        grade = "E";
    }

    let status;

    if(nilai > 75){
        status = "LULUS 🎉";
    }
    else{
        status = "REMEDIAL 📚";
    }

    document.getElementById("nilai")
    .innerText =
    nilai.toFixed(2);

    document.getElementById("grade")
    .innerText =
    grade;

    document.getElementById("status")
    .innerText =
    status;
}

</script>
